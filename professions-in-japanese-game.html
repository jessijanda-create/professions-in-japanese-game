<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>仕事 – przeciągnij do obrazka</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap">
<style>
:root{--bg:#f3f1ea;--card:#fff;--ink:#1d2540;--mute:#6b7186;--line:#d9d6ca;--accent:#2b4acb;--bad:#c8372d;--badbg:#fbe4e1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141829;--card:#252c4d;--ink:#eef0fa;--mute:#9aa1bd;--line:#323a5f;--accent:#8ea4ff;--bad:#ff8a80;--badbg:#44211f}}
:root[data-theme="dark"]{--bg:#141829;--card:#252c4d;--ink:#eef0fa;--mute:#9aa1bd;--line:#323a5f;--accent:#8ea4ff;--bad:#ff8a80;--badbg:#44211f}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:20px 14px 40px}
h1{font-size:1.5rem;font-weight:900;margin:8px 0 4px}
p.lead{color:var(--mute);margin:0 0 14px;line-height:1.5}
.top{display:flex;justify-content:space-between;color:var(--mute);font-size:.9rem;margin-bottom:12px}
#board{position:relative;display:grid;grid-template-columns:1fr 1fr;column-gap:clamp(40px,14vw,90px);user-select:none;-webkit-user-select:none}
#lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:2}
.col{display:grid;gap:10px}
#L{grid-auto-rows:96px}#R{grid-auto-rows:96px}
.it{position:relative;background:var(--card);color:var(--ink);border:3px solid var(--line);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;line-height:1.2;overflow:hidden}
.it[data-s="L"]{cursor:grab;touch-action:none;font:inherit}
.it[data-s="L"]:hover:not(.done){border-color:var(--accent)}
.it.sel,.it.hov{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent) inset}
.it.done{cursor:default}
.it.bad{animation:sh .35s;border-color:var(--bad);background:var(--badbg)}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.it.bad{animation:none}}
.w{font-size:1.25rem;font-weight:900}.w.long{font-size:1.05rem}
.r{font-size:.75rem;color:var(--mute);font-weight:700;min-height:1em}
.it svg{width:100%;height:100%;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.go{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:12px 20px;font:inherit;font-weight:700;cursor:pointer}
:root:not([data-theme="light"]) .go{color:#0e1226}
@media (prefers-color-scheme:light){.go{color:#fff}}
.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer}
label{color:var(--mute);font-size:.9rem;display:flex;gap:6px;align-items:center}
#res{margin-top:18px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px}
</style>
</head>
<body>
<main>
<h1>仕事 – przeciągnij do obrazka</h1>
<p class="lead">Złap słowo myszką (lub palcem) i przeciągnij je na osobę, która wykonuje ten zawód.</p>
<div class="top"><span id="st">Pary: 0/6</span><span id="er">Błędy: 0 · czas: 0 s</span></div>
<div id="board"><svg id="lines"></svg><div class="col" id="L"></div><div class="col" id="R"></div></div>
<div class="row"><label><input type="checkbox" id="rd"> pokaż czytanie hiraganą</label><button class="ghost" id="nw">Nowa runda</button></div>
<div id="res" hidden></div>
</main>
<script>
var SK="#fde0c5";
function glasses(){return '<g fill="none" stroke="#333" stroke-width="1.5"><circle cx="43" cy="40" r="5"/><circle cx="57" cy="40" r="5"/><path d="M48 40h4"/></g>'}
function person(o){
 return '<svg viewBox="0 0 100 100">'+(o.bg||'')+
 '<path d="M20 100q0-31 30-31q30 0 30 31z" fill="'+o.shirt+'"/>'+(o.body||'')+
 '<rect x="44" y="52" width="12" height="12" fill="'+SK+'"/><circle cx="50" cy="38" r="17" fill="'+SK+'"/>'+
 '<path d="M33 37q-1-21 17-21q18 0 17 21q-8-10-17-10q-9 0-17 10z" fill="'+o.hair+'"/>'+
 '<circle cx="43" cy="42" r="1.9" fill="#222"/><circle cx="57" cy="42" r="1.9" fill="#222"/>'+
 '<path d="M44 48q6 5 12 0" fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round"/>'+
 '<circle cx="38" cy="47" r="2.6" fill="#f5a9a0" opacity=".6"/><circle cx="62" cy="47" r="2.6" fill="#f5a9a0" opacity=".6"/>'+
 (o.top||'')+(o.front||'')+'</svg>';
}
var cap='<rect x="29" y="26" width="42" height="5" rx="2" fill="';
// [słowo, czytanie, polski, svg]
var W=[
["画家","がか","malarz",person({shirt:"#5b8def",hair:"#5a3a22",top:'<ellipse cx="50" cy="21" rx="21" ry="7" fill="#d94b4b"/><circle cx="50" cy="13" r="2.6" fill="#d94b4b"/>',front:'<ellipse cx="72" cy="82" rx="16" ry="11" fill="#c8915a"/><circle cx="66" cy="78" r="2.6" fill="#d94b4b"/><circle cx="73" cy="76" r="2.6" fill="#2b4acb"/><circle cx="79" cy="82" r="2.6" fill="#f2c200"/><path d="M58 98L84 62" stroke="#444" stroke-width="3" stroke-linecap="round"/><circle cx="85" cy="60" r="3.5" fill="#d94b4b"/>'})],
["おんがく家","おんがくか","muzyk",person({shirt:"#8e5bd6",hair:"#222",front:'<g transform="rotate(-22 48 86)"><ellipse cx="48" cy="88" rx="13" ry="10" fill="#c0612b"/><rect x="46.5" y="58" width="3.5" height="22" fill="#5a2e12"/><path d="M43 88h10" stroke="#3a1a08" stroke-width="2"/></g><path d="M28 98L78 70" stroke="#333" stroke-width="2.2"/>'})],
["写真家","しゃしんか","fotograf",person({shirt:"#3d9a7a",hair:"#6b4423",front:'<rect x="31" y="70" width="38" height="24" rx="4" fill="#333"/><rect x="38" y="65" width="12" height="6" rx="1" fill="#333"/><circle cx="50" cy="82" r="9" fill="#8ec5e8" stroke="#111" stroke-width="3"/><circle cx="47" cy="79" r="2.5" fill="#fff" opacity=".8"/>'})],
["小説家","しょうせつか","pisarz",person({shirt:"#7a6a58",hair:"#999",top:glasses(),front:'<path d="M26 99V77q12-5 24 0q12-5 24 0V99q-12-5-24 0q-12-5-24 0z" fill="#fff" stroke="#555" stroke-width="2"/><path d="M50 77V95" stroke="#555" stroke-width="1.5"/><path d="M78 62L88 90" stroke="#2b4acb" stroke-width="3.5" stroke-linecap="round"/>'})],
["医者","いしゃ","lekarz",person({shirt:"#fff",hair:"#2a2a2a",body:'<path d="M50 70L42 100M50 70L58 100" stroke="#ccd" stroke-width="2" fill="none"/><path d="M39 66q0 20 11 20q11 0 11-20" fill="none" stroke="#444" stroke-width="2.6"/><circle cx="50" cy="88" r="4" fill="#888"/>',top:'<circle cx="50" cy="22" r="6" fill="#d6e6f0" stroke="#889" stroke-width="2"/>',front:'<rect x="66" y="82" width="12" height="3.5" fill="#d94b4b"/><rect x="70.2" y="78" width="3.5" height="12" fill="#d94b4b"/>'})],
["しんぶん記者","しんぶんきしゃ","dziennikarz",person({shirt:"#c9863b",hair:"#3a2a1a",top:'<path d="M32 28q18-17 36 0z" fill="#555"/><rect x="48" y="26" width="30" height="4" rx="2" fill="#444"/>',front:'<rect x="24" y="72" width="34" height="26" fill="#f3efe0" stroke="#666" stroke-width="2"/><path d="M28 79h26M28 85h26M28 91h16" stroke="#777" stroke-width="2.4"/><path d="M70 96L84 66" stroke="#d9a400" stroke-width="3.5" stroke-linecap="round"/>'})],
["エンジニア","えんじにあ","inżynier",person({shirt:"#f08a24",hair:"#333",top:'<path d="M31 31q0-22 19-22q19 0 19 22z" fill="#ffd23f"/><rect x="27" y="30" width="46" height="5" rx="2" fill="#f2b705"/>',front:'<circle cx="72" cy="84" r="8" fill="#9aa3ad"/><circle cx="72" cy="84" r="11.5" fill="none" stroke="#9aa3ad" stroke-width="5" stroke-dasharray="4.2 3.6"/><circle cx="72" cy="84" r="3.5" fill="#f3f1ea"/>'})],
["外交官","がいこうかん","dyplomata",person({shirt:"#243b6b",hair:"#333",body:'<path d="M50 70L41 100H59z" fill="#fff"/><path d="M47.5 70h5l2 7-4.5 19-4.5-19z" fill="#c0392b"/>',front:'<circle cx="74" cy="82" r="13" fill="#6cc3e8" stroke="#2b6b8a" stroke-width="2"/><path d="M61 82h26M74 69v26" stroke="#2b6b8a" stroke-width="1.5"/><ellipse cx="74" cy="82" rx="6" ry="13" fill="none" stroke="#2b6b8a" stroke-width="1.5"/>'})],
["会社員","かいしゃいん","pracownik firmy",person({shirt:"#6f7d8c",hair:"#222",body:'<path d="M50 70L42 100H58z" fill="#fff"/><path d="M47.5 70h5l2 7-4.5 19-4.5-19z" fill="#2b4acb"/>',front:'<path d="M62 82v-5h14v5" fill="none" stroke="#5a3a1a" stroke-width="3"/><rect x="52" y="82" width="36" height="18" rx="3" fill="#8b5a2b"/><rect x="68" y="88" width="4" height="4" fill="#e6c34a"/>'})],
["駅員","えきいん","pracownik stacji",person({shirt:"#1f3a68",hair:"#222",body:'<circle cx="44" cy="82" r="1.8" fill="#e6c34a"/><circle cx="56" cy="82" r="1.8" fill="#e6c34a"/><circle cx="44" cy="91" r="1.8" fill="#e6c34a"/><circle cx="56" cy="91" r="1.8" fill="#e6c34a"/>',top:'<path d="M32 28q18-19 36 0z" fill="#1f3a68"/>'+cap+'#e6c34a"/>',front:'<path d="M80 99V58" stroke="#555" stroke-width="2.5"/><path d="M80 58h16v13H80z" fill="#d94b4b"/>'})],
["役人","やくにん","urzędnik",person({shirt:"#7a8591",hair:"#222",top:glasses(),body:'<path d="M50 70L42 100H58z" fill="#fff"/>',front:'<rect x="22" y="76" width="30" height="22" fill="#fff" stroke="#666" stroke-width="2"/><path d="M27 83h20M27 89h20" stroke="#777" stroke-width="2.4"/><rect x="66" y="72" width="14" height="9" fill="#c0392b"/><rect x="70" y="81" width="6" height="15" fill="#8b5a2b"/>'})],
["大使","たいし","ambasador",person({shirt:"#1b1b2f",hair:"#444",body:'<path d="M50 70L42 100H58z" fill="#fff"/><path d="M28 78L72 100" stroke="#c0392b" stroke-width="7"/><path d="M43 69l7 4-7 4zM57 69l-7 4 7 4z" fill="#c0392b"/>',front:'<path d="M80 99V54" stroke="#555" stroke-width="2.5"/><rect x="80" y="54" width="17" height="12" fill="#fff" stroke="#999"/><circle cx="88.5" cy="60" r="3.5" fill="#d94b4b"/>'})],
["つうやく","つうやく","tłumacz ustny",person({shirt:"#2fa38e",hair:"#a0522d",bg:'<ellipse cx="15" cy="20" rx="13" ry="9" fill="#ffd9a0"/><text x="15" y="24" font-size="12" text-anchor="middle" fill="#333">あ</text><ellipse cx="85" cy="20" rx="13" ry="9" fill="#bfe3ff"/><text x="85" y="24" font-size="12" text-anchor="middle" fill="#333">A</text>',top:'<path d="M33 38q0-22 17-22q17 0 17 22" fill="none" stroke="#333" stroke-width="3"/><rect x="29" y="36" width="6" height="12" rx="3" fill="#333"/><rect x="65" y="36" width="6" height="12" rx="3" fill="#333"/><path d="M33 48q4 11 17 10" fill="none" stroke="#333" stroke-width="2"/><circle cx="51" cy="58" r="2.6" fill="#333"/>'})],
["先生","せんせい","nauczyciel",person({shirt:"#e05a7a",hair:"#3b2b20",bg:'<rect x="3" y="5" width="94" height="52" rx="3" fill="#2f6b4f" stroke="#8b5a2b" stroke-width="3"/><text x="8" y="30" font-size="15" fill="#fff" opacity=".9">あいう</text><text x="72" y="46" font-size="13" fill="#fff" opacity=".9">ABC</text>',top:glasses(),front:'<path d="M72 98L90 40" stroke="#8b5a2b" stroke-width="3" stroke-linecap="round"/>'})]
];
var $=function(i){return document.getElementById(i)};
var P,done,err,t0,timer,order,drg=null;
function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function col(i){return "hsl("+((i*57+215)%360)+",62%,48%)"}
function newRound(){
 P=sh(W).slice(0,6);done={};err=0;t0=Date.now();
 order={L:sh([0,1,2,3,4,5]),R:sh([0,1,2,3,4,5])};
 $("res").hidden=true;build();upd();
 clearInterval(timer);timer=setInterval(upd,1000);
}
function build(){
 var h="";
 order.L.forEach(function(k){var w=P[k];h+='<div class="it" data-s="L" data-k="'+k+'"><span class="w'+(w[0].length>5?' long':'')+'">'+w[0]+'</span><span class="r">'+(done[k]?w[2]:($("rd").checked?w[1]:""))+'</span></div>'});
 $("L").innerHTML=h;h="";
 order.R.forEach(function(k){h+='<div class="it" data-s="R" data-k="'+k+'" role="img" aria-label="obrazek">'+P[k][3]+'</div>'});
 $("R").innerHTML=h;
 document.querySelectorAll('.it[data-s="L"]').forEach(function(b){b.onpointerdown=down});
 Object.keys(done).forEach(mark);lines();
}
function find(s,k){return document.querySelector('.it[data-s="'+s+'"][data-k="'+k+'"]')}
function mark(k){[find("L",k),find("R",k)].forEach(function(b){b.classList.add("done");b.style.borderColor=col(done[k]-1)})}
function rel(x,y){var b=$("board").getBoundingClientRect();return [x-b.left,y-b.top]}
function down(e){
 var b=e.currentTarget,k=+b.dataset.k;
 if(done[k])return;
 e.preventDefault();
 var a=b.getBoundingClientRect(),s=rel(a.right,a.top+a.height/2);
 drg={k:k,b:b,sx:s[0],sy:s[1]};b.classList.add("sel");
 $("lines").insertAdjacentHTML("beforeend",'<line id="tmp" x1="'+s[0]+'" y1="'+s[1]+'" x2="'+s[0]+'" y2="'+s[1]+'" stroke="'+col(Object.keys(done).length)+'" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 8"/>');
}
function target(e){var el=document.elementFromPoint(e.clientX,e.clientY);return el&&el.closest('.it[data-s="R"]')}
window.addEventListener("pointermove",function(e){
 if(!drg)return;
 var p=rel(e.clientX,e.clientY),t=$("tmp");
 t.setAttribute("x2",p[0]);t.setAttribute("y2",p[1]);
 document.querySelectorAll(".hov").forEach(function(x){x.classList.remove("hov")});
 var r=target(e);if(r&&!done[r.dataset.k])r.classList.add("hov");
});
window.addEventListener("pointerup",function(e){
 if(!drg)return;
 var r=target(e),d=drg;drg=null;
 var t=$("tmp");if(t)t.remove();
 document.querySelectorAll(".hov").forEach(function(x){x.classList.remove("hov")});
 d.b.classList.remove("sel");
 if(!r||done[r.dataset.k])return;
 if(+r.dataset.k===d.k){
  done[d.k]=Object.keys(done).length+1;mark(d.k);
  d.b.querySelector(".r").textContent=P[d.k][2];
  lines();upd();
  if(Object.keys(done).length===6)finish();
 }else{
  err++;[d.b,r].forEach(function(x){x.classList.remove("bad");void x.offsetWidth;x.classList.add("bad");setTimeout(function(){x.classList.remove("bad")},400)});
  upd();
 }
});
window.addEventListener("pointercancel",function(){if(!drg)return;var t=$("tmp");if(t)t.remove();drg.b.classList.remove("sel");drg=null});
function lines(){
 var h="";
 Object.keys(done).forEach(function(k){
  var a=find("L",k).getBoundingClientRect(),b=find("R",k).getBoundingClientRect(),s=rel(a.right,a.top+a.height/2),t=rel(b.left,b.top+b.height/2);
  h+='<line x1="'+s[0]+'" y1="'+s[1]+'" x2="'+t[0]+'" y2="'+t[1]+'" stroke="'+col(done[k]-1)+'" stroke-width="4" stroke-linecap="round"/>';
 });
 $("lines").innerHTML=h;
}
function upd(){
 var n=Object.keys(done).length;
 $("st").textContent="Pary: "+n+"/6";
 if(n<6)$("er").textContent="Błędy: "+err+" · czas: "+Math.round((Date.now()-t0)/1000)+" s";
}
function finish(){
 clearInterval(timer);
 var t=Math.round((Date.now()-t0)/1000);
 $("er").textContent="Błędy: "+err+" · czas: "+t+" s";
 var m=err===0?"Bez błędów!":err<=2?"Bardzo dobrze.":"Spróbuj jeszcze raz.";
 $("res").hidden=false;
 $("res").innerHTML='<b style="font-size:1.2rem">Gotowe! '+m+'</b><p class="lead" style="margin:6px 0 12px">Błędy: '+err+', czas: '+t+' s.</p><button class="go" id="again">Kolejna runda</button>';
 $("again").onclick=newRound;
}
$("nw").onclick=newRound;
$("rd").onchange=build;
window.addEventListener("resize",lines);
newRound();
</script>
</body>
</html>
